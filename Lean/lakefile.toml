name = "ExactManyToOne"
version = "0.1.0"
keywords = ["math"]
defaultTargets = ["ExactManyToOne"]

[leanOptions]
pp.unicode.fun = true # pretty-prints `fun a ↦ b`
relaxedAutoImplicit = false
weak.linter.mathlibStandardSet = true
# the header linter demands Mathlib's Apache licence line; this repository is MIT
weak.linter.style.header = false
maxSynthPendingDepth = 3

[[require]]
name = "mathlib"
scope = "leanprover-community"
rev = "v4.35.0-rc3"

[[lean_lib]]
name = "ExactManyToOne"
